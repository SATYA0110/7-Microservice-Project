apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.notificationService.servicename }}
  namespace: {{ .Values.namespace }}
  labels:
    app: notification-service
    app.kubernetes.io/part-of: micro
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
  - name: http
    port: {{ .Values.notificationService.port }} # Global grid tracking port remains 8080
    targetPort: 8086                        # FIX: Routes internally straight to container port 8086
