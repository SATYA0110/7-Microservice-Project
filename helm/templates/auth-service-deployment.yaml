apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.authService.deploymentname }}
  namespace: {{ .Values.namespace }}
  labels:
    app: auth-service
spec:
  replicas: {{ .Values.authService.replicas }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: auth-service
        image: {{ .Values.authService.image }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8081  # Fixed to match application.properties
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health      # Fixed to match AuthController GetMapping
            port: 8081         # Fixed runtime port
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health      # Fixed to match AuthController GetMapping
            port: 8081         # Fixed runtime port
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        # Construct the exact URL Spring Boot expects using ConfigMap variables
        - name: AUTH_DB_URL
          value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
        # Map user credentials from your secretRef to the precise keys your code expects
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: dbUser
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: dbPassword
        envFrom:
        - configMapRef:
            name: auth-service-config
