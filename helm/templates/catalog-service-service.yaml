apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.catalogService.servicename }}
  namespace: {{ .Values.namespace }}
  labels:
    app: catalog-service
    app.kubernetes.io/part-of: menu
spec:
  type: ClusterIP
  selector:
    app: catalog-service
  ports:
  - name: http
    port: {{ .Values.catalogService.port }} # External 8080
    targetPort: 8082                        # Internal destination port
