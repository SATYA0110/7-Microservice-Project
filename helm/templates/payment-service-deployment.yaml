apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.paymentService.deploymentname }}
  namespace: {{ .Values.namespace }}
  labels:
    app: payment-service
spec:
  replicas: {{ .Values.paymentService.replicas }}
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.paymentService.port }}"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: payment-service
        image: {{ .Values.paymentService.image }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: {{ .Values.paymentService.port }}
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.paymentService.port }}
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.paymentService.port }}
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        # 1. FIXED: Corrected IP binding format string to 0.0.0.0 for proper routing
        - name: ASPNETCORE_URLS
          value: "http://0.0.0.0:{{ .Values.paymentService.port }}"
        # 2. FIXED: Injected schema directly via Helm template to resolve the evaluation order crash
        - name: PAYMENT_DB_URL
          value: "Host=$(DB_HOST);Port=$(DB_PORT);Database=$(DB_NAME);Username=$(DB_USER);Password=$(DB_PASSWORD);SSL Mode=$(DB_SSLMODE);Search Path={{ .Values.paymentService.schema }},public;"
        envFrom:
        - configMapRef:
            name: payment-service-config
        - secretRef:
            name: payment-service-secr
