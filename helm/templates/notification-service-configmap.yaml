apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: {{ .Values.namespace }}
  labels:
    app: notification-service
data:
  SERVICE_NAME: "notification-service"
  PORT: "{{ .Values.notificationService.port }}"
  LOG_LEVEL: "info"
  # Assembled for Sinatra app; reads DB_USER and DB_PASSWORD directly from the Secret context at runtime
  NOTIFICATION_DB_URL: "postgres://$(DB_USER):$(DB_PASSWORD)@{{ .Values.db.host }}:{{ .Values.db.port }}/{{ .Values.db.name }}?sslmode={{ .Values.db.sslmode }}"
  REDIS_ADDR: "{{ .Values.redis.servicename }}:{{ .Values.redis.port }}"

