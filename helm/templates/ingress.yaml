{{- if .Values.ingress.enabled }}
# =============================================================================
# Application Ingress Routing (Standard Kubernetes Ingress)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ingress
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app: platform-services
spec:
  rules:
    - http:
        paths:
          # --- Auth Service ---
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.authService.servicename }}
                port:
                  number: {{ .Values.authService.port }}

          # --- Catalog Service ---
          - path: /api/catalog
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.catalogService.servicename }}
                port:
                  number: {{ .Values.catalogService.port }}

          # --- Inventory Service ---
          - path: /api/inventory
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.inventoryService.servicename }}
                port:
                  number: {{ .Values.inventoryService.port }}

          # --- Order Service ---
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.orderService.servicename }}
                port:
                  number: {{ .Values.orderService.port }}

          # --- Payment Service ---
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.paymentService.servicename }}
                port:
                  number: {{ .Values.paymentService.port }}

          # --- Notification Service ---
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.notificationService.servicename }}
                port:
                  number: {{ .Values.notificationService.port }}

          # --- Analytics Service ---
          - path: /api/analytics
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.analyticsService.servicename }}
                port:
                  number: {{ .Values.analyticsService.port }}

          # --- Frontend Web UI Catch-All ---
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.frontend.servicename }}
                port:
                  number: {{ .Values.frontend.port | default 80 }}
  {{- if .Values.ingress.tls }}
  tls:
    - secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
{{- end }}
  
